<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients matching BA Logo -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae0a5" />
      <stop offset="25%" stop-color="#dfa751" />
      <stop offset="50%" stop-color="#f5d188" />
      <stop offset="75%" stop-color="#b87a28" />
      <stop offset="100%" stop-color="#7e4a10" />
    </linearGradient>

    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0cc" />
      <stop offset="30%" stop-color="#e5b158" />
      <stop offset="70%" stop-color="#a66b1e" />
      <stop offset="100%" stop-color="#5c360a" />
    </linearGradient>

    <linearGradient id="goldGradStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87a28" />
      <stop offset="20%" stop-color="#fae0a5" />
      <stop offset="60%" stop-color="#dfa751" />
      <stop offset="100%" stop-color="#8c5314" />
    </linearGradient>

    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fae0a5" />
      <stop offset="40%" stop-color="#e5b158" />
      <stop offset="100%" stop-color="#8c5314" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dfa751" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .gold-text {
      font-family: 'Playfair Display', 'Cinzel', 'Georgia', serif;
      font-weight: 700;
      fill: url(#goldGrad1);
    }
    .since-text {
      font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.38em;
      fill: url(#goldGrad1);
    }
  </style>

  <!-- Dark Background -->
  <rect width="300" height="200" rx="16" fill="#030b08" />

  <!-- Monogram Group -->
  <g filter="url(#goldGlow)" transform="translate(10, 0)">
    
    <!-- Letter B -->
    <!-- B Main Stem & Serifs -->
    <path d="M 46 28 L 74 28 C 74 28 72 38 72 44 L 72 128 C 72 134 74 144 74 144 L 38 144 C 38 144 40 134 40 128 L 40 44 C 40 38 38 28 38 28 Z" fill="url(#goldGradStem)" />
    
    <!-- B Upper Bowl -->
    <path d="M 68 28 L 108 28 C 128 28 144 38 144 58 C 144 74 132 86 112 88 L 68 88 Z" fill="url(#goldGrad1)" />
    <path d="M 72 42 L 104 42 C 118 42 126 48 126 58 C 126 68 116 74 102 74 L 72 74 Z" fill="#030b08" />

    <!-- B Lower Bowl -->
    <path d="M 68 84 L 116 84 C 138 84 154 98 154 116 C 154 134 136 144 112 144 L 46 144 Z" fill="url(#goldGrad2)" />
    <path d="M 72 96 L 110 96 C 124 96 136 104 136 116 C 136 128 124 134 108 134 L 72 134 Z" fill="#030b08" />

    <!-- Letter A -->
    <!-- A Left diagonal -->
    <path d="M 174 28 L 138 144 L 158 144 L 182 64 L 206 144 L 230 144 L 194 28 Z" fill="url(#goldGrad1)" />
    <!-- A apex serif cap -->
    <path d="M 166 28 L 202 28 L 184 20 Z" fill="url(#goldGradStem)" />
    <!-- A triangle cutout -->
    <polygon points="184,52 168,110 200,110" fill="#030b08" />

    <!-- Interlocking Sweeping Arch Across BA -->
    <path d="M 88 88 Q 146 80 236 146 Q 164 96 88 96 Z" fill="url(#arcGrad)" />
    <path d="M 88 96 Q 146 88 236 146" stroke="#fff0cc" stroke-width="1.2" fill="none" opacity="0.8" />
  </g>

  <!-- SINCE 2026 Subtitle -->
  <text x="156" y="180" text-anchor="middle" class="since-text">SINCE 2026</text>
</svg>
